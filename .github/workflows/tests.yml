name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run django-admin makemigrations --check --skip-checks --pythonpath . --settings=tests.standalone_settings
      - run: npm ci
      - name: Check the committed stylesheet is what the sources build
        run: |
          npm run panel_framework_css
          git diff --exit-code -- panel_framework/static/panel_framework/css/panel_framework.css
      - name: Build the package
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Run the distribution tests against the built wheel
        run: |
          wheel="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          PANEL_FRAMEWORK_WHEEL="$wheel" uv run pytest tests/test_distribution.py
      - name: Install the built wheel into a clean environment
        run: tests/clean_install_check.sh "$(ls "$RUNNER_TEMP"/dist/*.whl)"
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python -m tests.check_release_tag "$GITHUB_REF_NAME"
