[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-panel-framework"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["django>=6.0,<6.1", "django-cotton>=2.1.3"]
license = "MIT"
license-files = ["LICENSE", "panel_framework/templates/panel_framework/icons/HEROICONS_LICENSE.txt"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11.1,<4.13",
    "pytest-randomly>=4.1.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-playwright>=0.7.2",
    "pytest-env>=1.1",
    "django-tasks>=0.8",
    "time-machine>=3.2.0",
    "pillow>=11.0",
    "lxml>=6.1.0",
    "cssselect>=1.4.0",
    "ruff>=0.14.10",
    "hatchling>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["panel_framework"]

[tool.hatch.build.targets.sdist]
include = ["panel_framework", "LICENSE", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.standalone_settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--nomigrations --strict-markers --disable-socket --allow-hosts=127.0.0.1,::1"
timeout = 300
env = ["DJANGO_ALLOW_ASYNC_UNSAFE = True"]
markers = [
    "playwright: browser-driven tests",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
extend-exclude = ["migrations"]
force-exclude = true
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort import sorting
    "N",      # pep8-naming
    "DJ",     # flake8-django
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print (no print in production)
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long: handled by ruff format
    "RUF012", # mutable class attributes: Django model fields by design
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "E402", "F401", "F403", "N806", "DJ"]
"*/__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101", "N802", "N806", "B011", "S106"]
"conftest.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["panel_framework", "tests"]
known-third-party = []
section-order = [
    "future", "standard-library", "third-party",
    "django", "first-party", "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "django.utils.translation.gettext_lazy",
    "django.utils.translation.pgettext_lazy",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
